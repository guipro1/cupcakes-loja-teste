<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CupcakeStore</title>
    <link rel="shortcut icon" href="img/cupcakestore-logo.svg" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header id="cabecalho">
        <div id="marca">
            <img id="marcaImagem" src="img/cupcakestore-logo.svg" width="128px" alt="">
            <p id="marcaSlogan">Delícias em miniatura que conquistam corações</p>
        </div>
        <!-- Navegação Global -->
        <nav id="navegacaoGlobal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sabores.html">Nossos Sabores</a></li>
                <li><a href="login.html">Login/Cadastro</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <main class="conteiner">
        <h1>Login de Acesso</h1>
        <form id="formularioLogin" class="formulario sombra" action="" method="post">
            <div>
                <div class="formulario-campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div class="formulario-campo">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" required>
                </div>
            </div>
            <div>
                <button class="botao-primario" type="submit">Enviar</button>
                <p>Ainda não possui cadastro? <a href="cadastro.html">Cadastre-se</a></p>
                
            </div>
        </form>

    </main>
    <hr>
    <footer id="rodape">
        <p>&copy; 2025 CupcakeStore - Todos os direitos reservados</p>
        <p>Siga-nos nas redes sociais: @cupcakestore</p>
        <p>Desenvolvido com ❤️ e muito açúcar</p>
    </footer>
</body>

</html>
